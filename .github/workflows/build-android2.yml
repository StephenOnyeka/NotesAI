# without EAS build

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: 🏗️ Build Android Release APK
        working-directory: android
        run: ./gradlew clean assembleRelease

      - name: 🏷️ Generate release tag
        id: release
        run: echo "TAG=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.TAG }}
          name: Android App ${{ steps.release.outputs.TAG }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: 📋 Build summary
        run: |
          echo "## ✅ Android APK Build Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📱 APK: app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "🏷️ Release: ${{ steps.release.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "📥 Download: https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
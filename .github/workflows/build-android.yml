name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Setup EAS CLI
        run: npm install --global eas-cli

      - name: 🔨 Build APK with EAS
        id: eas-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json

          echo "EAS build result:"
          cat build.json

      - name: 🔎 Get EAS Build ID
        id: build-info
        run: |
          BUILD_ID=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            console.log(build.id || build.buildId || build.build?.id || '');
          ")

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "undefined" ]; then
            echo "❌ Could not find EAS Build ID"
            cat build.json
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "✅ EAS Build ID: $BUILD_ID"
           
      - name: 📥 Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          eas --version

          mkdir -p dist
          cd dist

          eas build:download \
          --build-id "${{ steps.build-info.outputs.BUILD_ID }}" \
          --non-interactive

          APK=$(find . -maxdepth 1 -type f -name "*.apk" -print -quit || true)

          if [ -z "$APK" ]; then
            echo "❌ APK was not found"
            echo "Contents of dist:"
            ls -la
            exit 1
          fi

          mv "$APK" app-release.apk

          echo "✅ APK found: dist/app-release.apk"
          ls -lh app-release.apk

      - name: 🏷️ Generate release tag
        id: release
        run: |
          echo "TAG=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.TAG }}
          name: NotesAI Android ${{ steps.release.outputs.TAG }}
          files: dist/app-release.apk
          generate_release_notes: true

      - name: 📋 Build summary
        run: |
          echo "## ✅ Android APK Build Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📱 APK: app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "🏷️ Release: ${{ steps.release.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "📥 Download: https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
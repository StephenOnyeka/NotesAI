name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Setup EAS CLI
        run: npm install --global eas-cli

      - name: 🔨 Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: 📥 Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p dist
          eas build:download \
            --platform android \
            --profile preview \
            --latest \
            --output dist/app-release.apk

      - name: 🏷️ Generate release tag
        id: release
        run: |
          echo "TAG=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.TAG }}
          name: NotesAI Android ${{ steps.release.outputs.TAG }}
          files: dist/app-release.apk
          generate_release_notes: true

      - name: 📋 Build summary
        run: |
          echo "## ✅ Android APK Build Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📱 APK: app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "🏷️ Release: ${{ steps.release.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "📥 Download: https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" >> "$GITHUB_STEP_SUMMARY"